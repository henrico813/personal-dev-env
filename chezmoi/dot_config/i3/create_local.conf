# Settings for this machine. pde-installer writes ~/.config/i3/local.conf
# only when it is missing, so edit that copy. Changes to this source file
# reach only new machines.

# ---------- OUTPUT NAMES AND WORKSPACES ----------
# Find your outputs: xrandr --query | grep " connected"
# Then uncomment these lines and put your output names in place of
# OUTPUT-1 and OUTPUT-2.
# set $monitor_left OUTPUT-1
# set $monitor_right OUTPUT-2
# workspace 1 output $monitor_left
# workspace 2 output $monitor_left
# workspace 3 output $monitor_left
# workspace 4 output $monitor_left
# workspace 5 output $monitor_left
# workspace 6 output $monitor_right
# workspace 7 output $monitor_right
# workspace 8 output $monitor_right
# workspace 9 output $monitor_right
# workspace 10 output $monitor_right

# ---------- MONITOR LAYOUT ----------
# autorandr applies the saved profile. For a fixed layout, use xrandr, e.g.
# exec --no-startup-id xrandr --output OUTPUT-1 --primary --auto --output OUTPUT-2 --auto --right-of OUTPUT-1
exec --no-startup-id autorandr --change

# ---------- TERMINAL ----------
# i3-sensible-terminal starts the first terminal it finds. To pick one, use
# its full path when it is not on the session PATH, for example:
# bindsym $mod+t exec ~/.cargo/bin/alacritty
bindsym $mod+t exec i3-sensible-terminal
