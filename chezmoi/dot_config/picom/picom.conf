# Composite on the GPU. picom's default backend, xrender, makes Xorg
# blend every frame on one CPU core, which slowed the whole desktop.
backend = "glx";
vsync = true;
# Skips the stencil buffer; picom's manual measured 15% faster drawing.
glx-no-stencil = true;
# Waits until each window finishes drawing. picom's manual says some
# NVIDIA users need this with glx.
xrender-sync-fence = true;
