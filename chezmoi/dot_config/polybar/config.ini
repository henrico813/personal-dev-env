[colors]
background = #1a1b26
background-alt = #414868
foreground = #a9b1d6
primary = #7aa2f7
secondary = #bb9af7
alert = #f7768e
success = #9ece6a
warning = #e0af68
cyan = #7dcfff

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 28
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2

padding-left = 2
padding-right = 2
module-margin = 2

font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrainsMono Nerd Font:size=12;3
font-2 = Noto Color Emoji:scale=10;2

modules-left = i3
modules-center =
modules-right = player cava polypomo cpu memory bluetooth wlan wlan-ip tailscale vpn pulseaudio backlight battery world-clocks local-datetime

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

tray-position = none

[module/i3]
type = internal/i3
pin-workspaces = false
show-urgent = true
strip-wsnumbers = false
index-sort = true

label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-padding = 2

label-visible = %index%
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.cyan}
label = %percentage:3%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "MEM "
format-prefix-foreground = ${colors.cyan}
label = %percentage_used:3%%

[module/wlan]
type = internal/network
interface = ${env:WLAN_IFACE:wlan0}
interval = 3

format-connected = <label-connected>
label-connected = 󰖩 %essid%
label-connected-foreground = ${colors.success}

format-disconnected = <label-disconnected>
label-disconnected = 󰖪
label-disconnected-foreground = ${colors.alert}

click-left = nm-connection-editor

[module/wlan-ip]
type = internal/network
interface = ${env:WLAN_IFACE:wlan0}
interval = 3

format-connected = <label-connected>
label-connected = %local_ip%
label-connected-foreground = ${colors.warning}

format-disconnected =

[module/tailscale]
type = custom/script
exec = echo "󰖂 tailscale"
exec-if = nmcli -t -f NAME connection show --active | grep -qi tailscale
interval = 5
label-foreground = ${colors.cyan}

[module/vpn]
type = custom/script
exec = nmcli -t -f NAME,TYPE connection show --active | grep -E 'vpn|wireguard' | grep -vi tailscale | cut -d: -f1 | tr '\n' ' '
exec-if = nmcli -t -f NAME,TYPE connection show --active | grep -E 'vpn|wireguard' | grep -qvi tailscale
interval = 5
format-prefix = "󰦝 "
format-prefix-foreground = ${colors.primary}
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage:3%%
label-volume-foreground = ${colors.foreground}

label-muted = 󰝟
label-muted-foreground = ${colors.background-alt}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

click-right = pavucontrol

[module/backlight]
type = custom/script
exec = printf "󰃟 %3d%%" $(brightnessctl -m | cut -d, -f4 | tr -d '%')
interval = 2
scroll-up = ~/.config/pde-desktop/scripts/brightness-notify.sh 5%+
scroll-down = ~/.config/pde-desktop/scripts/brightness-notify.sh 5%-

[module/battery]
type = internal/battery
; launch.sh finds the battery and charger. Without a battery, polybar
; disables this module.
battery = ${env:BATTERY:}
adapter = ${env:ADAPTER:}
full-at = 98

format-charging = <ramp-capacity> <label-charging>
label-charging = %percentage:3%%
label-charging-foreground = ${colors.warning}

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage:3%%

format-full = <ramp-capacity> <label-full>
label-full = 100%
label-full-foreground = ${colors.success}

low-at = 20
format-low = <ramp-capacity> <label-low>
label-low = %percentage:3%%
label-low-foreground = ${colors.alert}

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹

[module/bluetooth]
type = custom/script
exec = bluetoothctl show | grep -q "Powered: yes" && echo "󰂯" || echo ""
interval = 5
click-left = blueman-manager
label-foreground = ${colors.cyan}

[module/player]
type = custom/script
exec = playerctl metadata --format '󰎈 {{artist}} - {{title}}' 2>/dev/null || echo ""
exec-if = playerctl status 2>/dev/null | grep -qE 'Playing|Paused'
interval = 3
click-left = playerctl play-pause
click-right = playerctl next
label-foreground = ${colors.secondary}
label-maxlen = 40

[module/cava]
type = custom/script
exec = ~/.config/i3/scripts/cava-polybar.sh
tail = true
label = %output%
label-foreground = ${colors.primary}

[module/polypomo]
type = custom/script
exec = ~/.config/pde-desktop/scripts/polypomo
tail = true
label = %output%
click-left = ~/.config/pde-desktop/scripts/polypomo toggle
click-right = ~/.config/pde-desktop/scripts/polypomo end
click-middle = ~/.config/pde-desktop/scripts/polypomo lock
scroll-up = ~/.config/pde-desktop/scripts/polypomo time +60
scroll-down = ~/.config/pde-desktop/scripts/polypomo time -60

[module/world-clocks]
; The clocks come from ~/.config/pde-desktop/world-clocks, which pde-installer
; never writes. Without that file the module stays hidden.
type = custom/script
exec = ~/.config/pde-desktop/scripts/world-clocks.sh
exec-if = test -s ~/.config/pde-desktop/world-clocks
interval = 60
label-foreground = ${colors.background-alt}

[module/local-datetime]
type = custom/script
exec = echo "$(date +'%Y-%m-%d %H:%M') $(curl -s --max-time 2 'wttr.in/?m&format=%c%t' 2>/dev/null)"
interval = 60
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = true
