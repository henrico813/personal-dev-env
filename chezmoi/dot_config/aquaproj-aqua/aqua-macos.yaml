# macOS uses this config for terminal and client. It leaves out fd, bat
# and eza, whose pinned versions have no Apple Silicon build, and Homebrew
# installs them instead. Keep the other pins equal to aqua-terminal.yaml.
registries:
  - type: standard
    ref: v4.550.0

checksum:
  enabled: true
  require_checksum: true

packages:
  - name: junegunn/fzf@v0.74.5
  - name: BurntSushi/ripgrep@14.1.1
  - name: jqlang/jq@jq-1.7.1
  - name: cli/cli@v2.101.0
  - name: dandavison/delta@0.19.2
  - name: max-sixty/worktrunk@v0.81.0
  - name: twpayne/chezmoi@v2.72.0
  - name: ajeetdsouza/zoxide@v0.9.8
  - name: ClementTsang/bottom@0.11.4
  - name: mikefarah/yq@v4.53.3
  - name: sxyazi/yazi@v25.5.31
  - name: gitleaks/gitleaks@v8.30.1
