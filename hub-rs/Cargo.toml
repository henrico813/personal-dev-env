[package]
name = "hub"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
publish = false

[[bin]]
name = "hub"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "error-context", "help", "usage"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
jiff = { version = "=0.2.42", features = ["serde"] }
regex = "=1.13.1"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
signal-hook = "=0.3.18"
