# What each profile installs. Code asks Profile methods such as Has, in
# profile.go, instead of comparing these names.
apt_groups:
  base: [ca-certificates, curl, file, git, gzip,
         tar, unzip, xclip, xz-utils, zsh]
  # fontconfig provides fc-cache for the fonts.
  fonts: [fontconfig]
  # The packed skill-lessons runs with /usr/bin/python3.
  python: [python3]
  dev: [build-essential, bzip2, gawk, make, patch]
  # Both desktops list this group. Apt runs with --no-install-recommends, so
  # each package a desktop config calls is listed.
  desktop: [alacritty, rofi, lxpolkit, network-manager-gnome, pavucontrol,
            pulseaudio-utils, brightnessctl, playerctl, psmisc,
            papirus-icon-theme, fonts-noto-color-emoji, blueman, dunst,
            mpv, ubuntu-wallpapers, thunar, libnotify-bin, bluez,
            greybird-gtk-theme,
            # polypomo runs with python3, which the terminal profile does not
            # install.
            python3,
            # The installer builds each desktop's wallpaper player, which
            # no Ubuntu package provides.
            build-essential]
  # The X11 headers build xwinwrap.
  i3: [i3-wm, i3lock, polybar, feh, picom, autorandr, arandr,
       xfce4-power-manager, xss-lock, dex, lxappearance, cava,
       xfce4-screenshooter, x11-xserver-utils,
       libx11-dev, libxext-dev, libxrender-dev]
  # waybar's scripts run apt's jq, because the session PATH may lack
  # Aqua's. The build tools and the mpv, Wayland and EGL headers build
  # mpvpaper.
  sway: [sway, xwayland, swaylock, swayidle, swaybg, waybar,
         wl-clipboard, grim, slurp, grimshot, xdg-desktop-portal-wlr, jq,
         meson, ninja-build, pkg-config, libmpv-dev, libwayland-dev,
         wayland-protocols, libegl-dev]

# Tiers say what a profile is for, and profile.go describes each one.
# The manifest tags every item with the tier that installs it.
profiles:
  # Installs the shell, tmux and command-line tools for headless
  # homelab VMs.
  terminal: {apt: [base], tiers: [terminal]}
  # Installs Neovim, OpenCode, herdr and fonts for a laptop that
  # compiles nothing. It leaves out Go, Rust, the approval tools and
  # every local build but skill-lessons.
  client:
    apt: [base, fonts, python]
    tiers: [terminal, workstation]
  # Installs everything for dev machines, including Go, Rust and local
  # builds.
  full:
    apt: [base, fonts, python, dev]
    tiers: [terminal, workstation, development]

# A desktop adds a window manager to a machine with a saved profile.
# Its packages were checked on Ubuntu 24.04 only.
desktops:
  i3: {min_ubuntu: "24.04", apt: [desktop, i3]}
  sway: {min_ubuntu: "24.04", apt: [desktop, sway]}
