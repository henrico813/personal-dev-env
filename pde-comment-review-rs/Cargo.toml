[package]
name = "pde-comment-review"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[[bin]]
name = "pde-comment-review-next"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
libc = "0.2.190"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.3.18"
tree-sitter = "0.27.1"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[features]
# Lets this crate's tests keep the waiting list in a folder of their own.
test-util = []

[dev-dependencies]
# Turns test-util on for this crate's own tests only, never for `cargo build`.
pde-comment-review = { path = ".", features = ["test-util"] }
