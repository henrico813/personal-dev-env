name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  planner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: planner/go.mod
          cache-dependency-path: planner/go.sum
      - name: install golangci-lint
        run: make init
      - name: check
        run: make check

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: install chezmoi and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          mkdir -p "$RUNNER_TEMP/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin" v2.72.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: test
        run: go test ./...

  surveil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cargo build --release --manifest-path surveil/Cargo.toml
      - name: test
        run: cargo test --manifest-path surveil/Cargo.toml

  vibe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe
    steps:
      - uses: actions/checkout@v4
      - name: check
        run: make check
      - name: integration
        run: make integration
