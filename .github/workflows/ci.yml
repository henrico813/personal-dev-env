name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  planner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: planner/go.mod
          cache-dependency-path: planner/go.sum
      - name: install golangci-lint
        run: make init
      - name: check
        run: make check

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: test
        run: go test ./...

  pde-installer-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pde-installer/go.mod
          cache-dependency-path: pde-installer/go.sum
      - name: install zsh for fixture verification
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: verify smoke prerequisites
        run: |
          test -x /usr/bin/sudo
          sudo -n true
          for tool in git sudo tar sha256sum zsh cmp diff install; do
            command -v "$tool" >/dev/null
          done
      - name: rootless command smoke
        run: ./pde-installer/test/verify-ci-smoke.sh

  surveil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cargo build --release --manifest-path surveil/Cargo.toml
      - name: test
        run: cargo test --manifest-path surveil/Cargo.toml

  vibe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe
    steps:
      - uses: actions/checkout@v4
      - name: check
        run: make check
      - name: integration
        run: make integration
