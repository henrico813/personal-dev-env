# Publishes a hub release when a merge to main changes hub-rs/ with a
# feat, fix, perf or breaking commit. hub-rs/cliff.toml says which
# commit bumps which part of the version. Other merges end green with no
# release, and a rerun finds the tag it made and stops.
name: hub release

on:
  push:
    branches: [main]
    paths: ['hub-rs/**']
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, so two quick merges cannot take the same number.
concurrency:
  group: hub-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GIT_CLIFF_VERSION: 2.14.2
      GIT_CLIFF_SHA512: 26d1f7c8ea2400f2ccb0b2e7f321635f600b583bf4cd1f7afaa5e8c24068ad1088a2504e0a4d9f4333d4bb20a80329327d9462634343ee3af91e1a7fbdc6f18a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # git-cliff and git describe need every tag and the commits since.
          fetch-depth: 0
          # Keeps the write token out of .git/config, where the build and
          # tests could read it.
          persist-credentials: false
      - name: install git-cliff
        run: |
          archive="git-cliff-$GIT_CLIFF_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/orhun/git-cliff/releases/download/v$GIT_CLIFF_VERSION/$archive"
          echo "$GIT_CLIFF_SHA512  $RUNNER_TEMP/$archive" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/git-cliff-$GIT_CLIFF_VERSION" >>"$GITHUB_PATH"
      - name: pick the version
        run: |
          # The tag goes on the last commit that changed hub-rs/. git-cliff
          # ignores a tag on any other commit and would count old commits
          # again. hub-rs/ there matches the checkout, so the build is the same.
          target=$(git log -1 --format=%H -- hub-rs)
          covered=$(git tag --list 'hub-v*' --contains "$target")
          if [ -n "$covered" ]; then
            echo "Releases that already cover $target"
            echo "$covered"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'hub-v*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            # The first release takes Cargo.toml's version.
            version=$(cargo metadata --no-deps --format-version 1 \
              --manifest-path hub-rs/Cargo.toml | jq -r '.packages[0].version')
          else
            next=$(git-cliff --config hub-rs/cliff.toml \
              --include-path 'hub-rs/**' --bumped-version)
            if [ "$next" = "$last" ]; then
              echo "No hub commit since $last calls for a release."
              exit 0
            fi
            version=${next#hub-v}
          fi
          if git rev-parse --quiet --verify "refs/tags/hub-v$version" >/dev/null; then
            echo "hub-v$version already exists."
            exit 0
          fi
          echo "HUB_VERSION=$version" >>"$GITHUB_ENV"
          echo "HUB_TARGET=$target" >>"$GITHUB_ENV"
      - name: check
        if: env.HUB_VERSION != ''
        run: make -C hub-rs check
      - name: build
        if: env.HUB_VERSION != ''
        run: make -C hub-rs build
      - name: package
        if: env.HUB_VERSION != ''
        run: |
          test "$(hub-rs/target/release/hub --version)" = "hub $HUB_VERSION"
          name="hub-$HUB_VERSION-x86_64-linux"
          mkdir dist
          cp hub-rs/target/release/hub "dist/$name"
          (cd dist && sha256sum "$name" >"$name.sha256")
          git-cliff --config hub-rs/cliff.toml --include-path 'hub-rs/**' \
            --unreleased --output notes.md
      - name: publish
        if: env.HUB_VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "hub-v$HUB_VERSION" dist/* \
            --target "$HUB_TARGET" \
            --title "hub $HUB_VERSION" \
            --notes-file notes.md
