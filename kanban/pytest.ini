# Markers sort card's tests by each command a test runs, so a run can leave
# out some commands, such as -m "not (cmd_move or cmd_rekey)".
[pytest]
addopts = --strict-markers
markers =
    cmd_add: runs card add
    cmd_attach: runs card attach
    cmd_board: runs card board
    cmd_check: runs card check
    cmd_delete: runs card delete
    cmd_edit: runs card edit
    cmd_grep: runs card grep
    cmd_link: runs card link
    cmd_list: runs card list
    cmd_merged: runs card merged
    cmd_move: runs card move
    cmd_name: runs card name
    cmd_new: runs card new
    cmd_note: runs card note
    cmd_outline: runs card outline
    cmd_rekey: runs card rekey
    cmd_set: runs card set
    cmd_show: runs card show
    cmd_template: runs card template
