repos:
  - repo: local
    hooks:
      - id: go-check
        name: make check
        entry: bash -c 'cd planner && make check'
        language: system
        files: ^planner/.*\.go$
        pass_filenames: false
      - id: scan
        name: ci/scan
        entry: bash ci/scan staged
        language: system
        pass_filenames: false
        always_run: true
