repos:
  - repo: local
    hooks:
      - id: dockerfile-packages
        name: one package per line in Dockerfiles
        entry: python3 ci/check_dockerfile_packages.py
        language: system
        files: (^|/)Dockerfile(\.[^/]*)?$
      - id: go-check
        name: make check
        entry: bash -c 'cd planner && make check'
        language: system
        files: ^planner/.*\.go$
        pass_filenames: false
