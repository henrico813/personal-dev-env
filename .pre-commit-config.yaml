repos:
  - repo: local
    hooks:
      - id: go-check
        name: make check
        entry: bash -c 'cd planner && make check'
        language: system
        files: ^planner/.*\.go$
        pass_filenames: false
      - id: privacy-scan
        name: privacy scan
        entry: bash scripts/privacy-scan staged
        language: system
        pass_filenames: false
        always_run: true
